name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same file Railway builds from, so CI tests on exactly the Node.js
      # production runs - including its security patch level.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build
